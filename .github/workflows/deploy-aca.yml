name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACA_NAME: ${{ vars.ACA_NAME }}
  ACA_ENVIRONMENT: ${{ vars.ACA_ENVIRONMENT }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'sendcraft-web' }}
  TARGET_PORT: "8080"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_FULL_NAME="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_FULL_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        shell: bash
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        shell: bash
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest" \
            .

          docker push "${{ steps.meta.outputs.image }}"
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"

      - name: Enable ACR admin user
        shell: bash
        run: |
          az acr update \
            --name "$ACR_NAME" \
            --admin-enabled true

      - name: Get ACR credentials
        id: acr
        shell: bash
        run: |
          ACR_SERVER="${ACR_NAME}.azurecr.io"

          ACR_USERNAME="$(az acr credential show \
            --name "$ACR_NAME" \
            --query username \
            --output tsv)"

          ACR_PASSWORD="$(az acr credential show \
            --name "$ACR_NAME" \
            --query "passwords[0].value" \
            --output tsv)"

          echo "server=${ACR_SERVER}" >> "$GITHUB_OUTPUT"
          echo "username=${ACR_USERNAME}" >> "$GITHUB_OUTPUT"
          echo "password=${ACR_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Create or update Container App
        shell: bash
        run: |
          if az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACA_NAME" >/dev/null 2>&1; then

            echo "Updating existing Container App: $ACA_NAME"

            az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ACA_NAME" \
              --image "${{ steps.meta.outputs.image }}"
          else
            echo "Creating Container App: $ACA_NAME"

            az containerapp create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$ACA_NAME" \
              --environment "$ACA_ENVIRONMENT" \
              --image "${{ steps.meta.outputs.image }}" \
              --registry-server "${{ steps.acr.outputs.server }}" \
              --registry-username "${{ steps.acr.outputs.username }}" \
              --registry-password "${{ steps.acr.outputs.password }}" \
              --target-port "$TARGET_PORT" \
              --ingress external \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi
          fi

      - name: Show public URL
        shell: bash
        run: |
          FQDN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ACA_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          echo "Deployed: https://${FQDN}"
          echo "url=https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"
