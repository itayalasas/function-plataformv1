name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ---- Customize these (or set as repo variables/secrets) ----
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACA_NAME:             ${{ vars.ACA_NAME }}            # e.g. sendcraft-web
  ACA_ENVIRONMENT:      ${{ vars.ACA_ENVIRONMENT }}     # ACA managed env name
  ACR_NAME:             ${{ vars.ACR_NAME }}            # Azure Container Registry (without .azurecr.io)
  IMAGE_NAME:           ${{ vars.IMAGE_NAME || 'sendcraft-web' }}
  AZURE_LOCATION:       ${{ vars.AZURE_LOCATION || 'northcentralus' }}
  TARGET_PORT:          '8080'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build & push image
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" \
                       -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"

      - name: Ensure Container App exists
        run: |
          set -e
          if az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" >/dev/null 2>&1; then
            echo "Container App $ACA_NAME already exists."
          else
            echo "Creating Container App shell $ACA_NAME..."
            az containerapp create \
              -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" \
              --environment "$ACA_ENVIRONMENT" \
              --image "mcr.microsoft.com/k8se/quickstart:latest" \
              --target-port "$TARGET_PORT" \
              --ingress external \
              --min-replicas 1 --max-replicas 3 \
              --cpu 0.5 --memory 1.0Gi
          fi

      - name: Configure ACR access
        run: |
          set -e
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          ACR_ID=$(az acr show -n "$ACR_NAME" --query id -o tsv)

          echo "Ensuring Container App identity..."
          az containerapp identity assign \
            -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" \
            --system-assigned >/dev/null

          PRINCIPAL_ID=""
          for _ in $(seq 1 12); do
            PRINCIPAL_ID=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" --query identity.principalId -o tsv)
            if [ -n "$PRINCIPAL_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$PRINCIPAL_ID" ]; then
            echo "Failed to resolve the Container App principal ID."
            exit 1
          fi

          echo "Granting AcrPull to $PRINCIPAL_ID on $ACR_ID..."
        
          echo "Waiting for RBAC propagation..."
          sleep 20

          echo "Configuring Container App registry access..."
          az containerapp registry set \
            -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" \
            --server "$ACR_SERVER" \
            --identity system

      - name: Deploy private image
        run: |
          set -e
          az containerapp update \
            -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" \
            --image "${{ steps.meta.outputs.image }}"

      - name: Show public URL
        run: |
          FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$ACA_NAME" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "🚀 Deployed: https://$FQDN"
          echo "url=https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
